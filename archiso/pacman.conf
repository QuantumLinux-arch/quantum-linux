# pacman.conf para construir el ISO de Quantum Linux.
# @QUANTUM_REPO@ se reemplaza por la ruta del repositorio local al construir.

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Paquetes propios (quantum-*, calamares, ckbcomp)
[quantum]
SigLevel = Optional TrustAll
Server = file://@QUANTUM_REPO@

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
