SERIAL 0 115200
UI vesamenu.c32
MENU TITLE Quantum Linux
MENU BACKGROUND splash.png

MENU WIDTH 78
MENU MARGIN 8
MENU ROWS 5
MENU VSHIFT 14
MENU TABMSGROW 21
MENU CMDLINEROW 21
MENU HELPMSGROW 23
MENU HELPMSGENDROW 29

MENU COLOR border       30;44   #00000000 #00000000 none
MENU COLOR title        1;36;44 #00000000 #00000000 none
MENU COLOR sel          7;37;40 #ffffffff #c06a5cff std
MENU COLOR unsel        37;44   #c09c95b8 #00000000 none
MENU COLOR help         37;40   #c09c95b8 #00000000 none
MENU COLOR timeout_msg  37;40   #80a79ba8 #00000000 none
MENU COLOR timeout      1;37;40 #c04fd8ff #00000000 none
MENU COLOR msg07        37;40   #90ffffff #00000000 none
MENU COLOR tabmsg       31;40   #806e6890 #00000000 none

MENU CLEAR
MENU IMMEDIATE
TIMEOUT 100
DEFAULT quantum

LABEL quantum
TEXT HELP
Arranca Quantum Linux sin instalar nada. Desde ahí puedes instalarlo.
ENDTEXT
MENU LABEL Probar o instalar Quantum Linux
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3

LABEL quantumsafe
TEXT HELP
Usa esta opción si la pantalla queda negra o con colores raros.
ENDTEXT
MENU LABEL Probar o instalar Quantum Linux (modo compatible)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset

LABEL existing
TEXT HELP
Arranca el sistema que ya está instalado en el disco.
ENDTEXT
MENU LABEL Arrancar desde el disco
COM32 chain.c32
APPEND hd0 0

LABEL reboot
MENU LABEL Reiniciar
COM32 reboot.c32

LABEL poweroff
MENU LABEL Apagar
COM32 poweroff.c32
