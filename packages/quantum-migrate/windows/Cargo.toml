[package]
name = "pasar-a-quantum"
version = "1.0.0"
edition = "2021"
description = "Pasar a Quantum: copia tus cosas de Windows a un pendrive para llevarlas a Quantum Linux"

[[bin]]
name = "pasar-a-quantum"
path = "src/main.rs"

[[bin]]
name = "instalar-quantum"
path = "src/instalar.rs"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["wgpu", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
filetime = "0.2"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
sha2 = "0.10"
sha-crypt = "0.5"
rand = "0.8"

# solo para desarrollar la interfaz en Linux
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
# DirectX 12 (con WARP, el render por software de Windows: anda sin tarjeta gráfica ni drivers)
wgpu = { version = "24", default-features = false, features = ["dx12", "wgsl"] }
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com",
  "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_Security_Authentication_Identity",
  "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_WindowsProgramming", "Win32_Security", "Win32_System_SystemInformation"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
