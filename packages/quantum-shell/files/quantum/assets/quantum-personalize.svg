<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Ícono de Personalizar: las órbitas de Quantum con el cubo pintado de colores -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FD8FF"/>
      <stop offset="0.5" stop-color="#6A5CFF"/>
      <stop offset="1" stop-color="#B14DFF"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD36B"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7EE7FF"/><stop offset="1" stop-color="#22C58B"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7AA8"/><stop offset="1" stop-color="#E040FB"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1B0F5C" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="118" rx="64" fill="#FFFFFF" opacity="0.10"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-opacity="0.92">
    <ellipse cx="128" cy="128" rx="94" ry="34" transform="rotate(90 128 128)"/>
    <ellipse cx="128" cy="128" rx="94" ry="34" transform="rotate(-30 128 128)"/>
    <ellipse cx="128" cy="128" rx="94" ry="34" transform="rotate(30 128 128)"/>
  </g>
  <!-- electrones de colores -->
  <circle cx="47" cy="81" r="11" fill="#FFFFFF"/><circle cx="47" cy="81" r="6" fill="#FFB547"/>
  <circle cx="209" cy="175" r="11" fill="#FFFFFF"/><circle cx="209" cy="175" r="6" fill="#22C58B"/>
  <circle cx="128" cy="34" r="11" fill="#FFFFFF"/><circle cx="128" cy="34" r="6" fill="#FF4F7B"/>
  <!-- cubo pintado -->
  <g filter="url(#sh)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round">
    <polygon points="128,92 162,111.5 128,131 94,111.5" fill="url(#top)"/>
    <polygon points="94,111.5 128,131 128,170 94,150.5" fill="url(#left)"/>
    <polygon points="128,131 162,111.5 162,150.5 128,170" fill="url(#right)"/>
  </g>
  <!-- destello -->
  <path d="M199 40l5.5 14 14 5.5-14 5.5-5.5 14-5.5-14-14-5.5 14-5.5z" fill="#FFFFFF"/>
</svg>
