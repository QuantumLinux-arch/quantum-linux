# Quantum Linux: configuración base de Wayfire (gestor de ventanas).
#
# Este archivo es del sistema. quantum-theme lo combina con tus ajustes
# (Centro Quantum) y con ~/.config/quantum/wayfire-user.ini, y escribe el
# resultado en ~/.local/state/quantum/wayfire.ini, que es el que usa la sesión.
# Para cambiar algo, crea ~/.config/quantum/wayfire-user.ini con las secciones
# y opciones que quieras reemplazar.

[core]
plugins = @PLUGINS@
close_top_view = <alt> KEY_F4 | <super> KEY_Q
preferred_decoration_mode = server
vwidth = 4
vheight = 1
background_color = \#07060DFF
xwayland = true
focus_buttons_passthrough = true

[input]
xkb_layout = @KB_LAYOUT@
xkb_variant = @KB_VARIANT@
xkb_options = @KB_OPTIONS@
kb_numlock_default_state = true
modifier_binding_timeout = 400
cursor_theme = Adwaita
cursor_size = 24
natural_scroll = true
tap_to_click = true
disable_touchpad_while_typing = true

[quantum-decor]
font = Inter Semi-Bold
font_color = @TITLE_COLOR@
font_scale = 0.48
title_height = 34
border_size = 1
button_order = minimize maximize close
button_scale = 0.78
button_padding = 4
active_color = @ACTIVE_COLOR@
inactive_color = @INACTIVE_COLOR@
button_icon_color = @BUTTON_COLOR@
button_hover_color = @BUTTON_HOVER@
close_hover_color = \#E81123FF

[animate]
open_animation = zoom
close_animation = zoom
minimize_animation = squeezimize
duration = 180ms circle
squeezimize_duration = 200ms circle
fade_enabled_for = type equals "overlay"
fade_duration = 200ms circle

[wobbly]
friction = 2.6
spring_k = 6.5

[blur]
blur_by_default = app_id is "kitty"
method = kawase
kawase_offset = 2.5
kawase_iterations = 3

[place]
mode = center

# Arrastrar una ventana a un borde la acopla (mitad o pantalla completa)
[move]
activate = <super> BTN_LEFT
enable_snap = true
snap_threshold = 12
quarter_snap_threshold = 60
enable_snap_off = true
snap_off_threshold = 12

[resize]
activate = <super> BTN_RIGHT

# Win + flechas: acoplar como en Windows
[grid]
duration = 220ms circle
type = crossfade
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT
slot_c = <super> KEY_UP
restore = <super> KEY_DOWN
slot_tl = <super> KEY_KP7
slot_tr = <super> KEY_KP9
slot_bl = <super> KEY_KP1
slot_br = <super> KEY_KP3

# Alt + Tab cambia de ventana
[fast-switcher]
activate = <alt> KEY_TAB
activate_backward = <alt> <shift> KEY_TAB
inactive_alpha = 0.55

# Win + Tab: vista de tareas (todos los escritorios)
[expo]
toggle = <super> KEY_TAB
duration = 280ms circle
inactive_brightness = 0.6

# Ctrl + Win + flechas: cambiar de escritorio, como en Windows
[vswitch]
binding_left = <ctrl> <super> KEY_LEFT
binding_right = <ctrl> <super> KEY_RIGHT
with_win_left = <ctrl> <super> <shift> KEY_LEFT
with_win_right = <ctrl> <super> <shift> KEY_RIGHT
binding_up = none
binding_down = none
with_win_up = none
duration = 280ms circle
gap = 0
background = \#07060DFF

[wm-actions]
toggle_showdesktop = <super> KEY_D
toggle_fullscreen = <super> KEY_F11 | KEY_F11
minimize = <super> <shift> KEY_DOWN
toggle_always_on_top = <super> <ctrl> KEY_T

[simple-tile]
tile_by_default = all
inner_gap_size = 6
outer_horiz_gap_size = 8
outer_vert_gap_size = 8
key_toggle = <super> KEY_SPACE
animation_duration = 220ms circle

[idle]
screensaver_timeout = -1
dpms_timeout = 900
disable_on_fullscreen = true

[autostart]
autostart_wf_shell = false
0_env = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XAUTHORITY XDG_CURRENT_DESKTOP WAYFIRE_SOCKET
1_portal = /usr/lib/xdg-desktop-portal
2_shell = @SHELL_CMD@
3_polkit = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
4_idle = hypridle -c /usr/share/quantum/hypridle.conf
# tareas de fondo: esperan a que el escritorio termine de cargar
5_clip_text = sh -c 'sleep 8; exec wl-paste --type text --watch cliphist store'
5_clip_image = sh -c 'sleep 8; exec wl-paste --type image --watch cliphist store'
6_dirs = sh -c 'sleep 10; exec xdg-user-dirs-update'
# luz nocturna y ajustes de imagen (Personalizar → Pantalla)
7_display = quantum-display
# agente de Bluetooth: sin él BlueZ rechaza emparejar y conectar audífonos («Authentication attempt without agent»)
6_bluetooth = sh -c 'sleep 6; command -v blueman-applet >/dev/null && exec blueman-applet'
# monta los pendrives al conectarlos y abre «Pasar desde Windows» si traen tus cosas
6_migrate = sh -c 'sleep 12; command -v quantum-migrate >/dev/null && exec quantum-migrate --watch'
# sistema en vivo: si el pendrive trae respuestas del instalador de Windows, instala solo
7_autoinstall = sh -c 'command -v quantum-autoinstall >/dev/null && exec quantum-autoinstall'
# 7_center: lo abre el shell cuando termina de cargar el escritorio

# Atajos del shell y de las apps
[command]
binding_launcher = <super>
command_launcher = qs -c quantum ipc call shell launcher
binding_controlcenter = <super> KEY_A
command_controlcenter = qs -c quantum ipc call shell controlCenter
binding_notifs = <super> KEY_N
command_notifs = qs -c quantum ipc call shell controlCenter
binding_clipboard = <super> KEY_V
command_clipboard = qs -c quantum ipc call shell clipboard
binding_wallpapers = <super> KEY_W
command_wallpapers = qs -c quantum ipc call shell wallpapers
binding_personalize = <super> KEY_P
binding_ai = <super> KEY_H
command_ai = qs -c quantum ipc call shell ai
command_personalize = qs -c quantum ipc call shell personalize
binding_dashboard = <super> KEY_C
command_dashboard = qs -c quantum ipc call shell dashboard
binding_session = <super> KEY_X
command_session = qs -c quantum ipc call shell session
binding_ctrlaltdel = <ctrl> <alt> KEY_DELETE
command_ctrlaltdel = qs -c quantum ipc call shell session
binding_lock = <super> KEY_L
command_lock = qs -c quantum ipc call lock lock
binding_gamemode = <super> KEY_G
command_gamemode = qs -c quantum ipc call shell gameMode
binding_terminal = <ctrl> <alt> KEY_T
command_terminal = kitty
binding_terminal2 = <super> KEY_ENTER
command_terminal2 = kitty
binding_files = <super> KEY_E
command_files = quantum-files
binding_settings = <super> KEY_I
command_settings = quantum-center --page ajustes
binding_taskmgr = <ctrl> <shift> KEY_ESC
command_taskmgr = missioncenter
binding_shot_region = <super> <shift> KEY_S
command_shot_region = quantum-screenshot region
binding_print = KEY_SYSRQ | KEY_PRINT
command_print = quantum-screenshot region
binding_print_full = <shift> KEY_SYSRQ | <shift> KEY_PRINT
command_print_full = quantum-screenshot screen
repeatable_binding_vol_up = KEY_VOLUMEUP
command_vol_up = wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
repeatable_binding_vol_down = KEY_VOLUMEDOWN
command_vol_down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binding_mute = KEY_MUTE
command_mute = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binding_micmute = KEY_MICMUTE
command_micmute = wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
repeatable_binding_bright_up = KEY_BRIGHTNESSUP
command_bright_up = qs -c quantum ipc call shell brightnessUp
repeatable_binding_bright_down = KEY_BRIGHTNESSDOWN
command_bright_down = qs -c quantum ipc call shell brightnessDown
binding_play = KEY_PLAYPAUSE
command_play = playerctl play-pause
binding_next = KEY_NEXTSONG
command_next = playerctl next
binding_prev = KEY_PREVIOUSSONG
command_prev = playerctl previous

[window-rules]
pip = on created if title contains "Picture-in-Picture" then set always_on_top
