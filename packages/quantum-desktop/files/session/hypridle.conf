# Quantum Linux: inactividad. Las apps que reproducen video o juegos lo pausan solas.
# Wayfire apaga la pantalla a los 15 minutos (plugin idle).
general {
    lock_cmd = qs -c quantum ipc call lock lock
    before_sleep_cmd = loginctl lock-session
}

# 9 min: bajar el brillo (portátiles)
listener {
    timeout = 540
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

# 10 min: bloquear
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
