# Quantum Linux: ajustes de rendimiento para escritorio y juegos.

# Con zram conviene que el kernel use el swap comprimido con más ganas.
vm.swappiness = 150
vm.page-cluster = 0

# Evita tirones en juegos que provocan "split locks" (Proton/Wine).
kernel.split_lock_mitigate = 0

# Escritorio fluido: guardar en caché los directorios y archivos más tiempo, y escribir
# al disco en tandas más chicas (evita tirones al copiar archivos grandes o instalar).
vm.vfs_cache_pressure = 50
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456

# Juegos modernos (Proton) necesitan muchos mapas de memoria.
vm.max_map_count = 2147483642
