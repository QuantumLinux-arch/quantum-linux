# Calamares para Quantum Linux
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:     cleanlive
  module: shellprocess
  config: shellprocess_cleanlive.conf
- id:     hardware
  module: shellprocess
  config: shellprocess_hardware.conf
- id:     secureboot
  module: shellprocess
  config: shellprocess_secureboot.conf
- id:     grubtheme
  module: shellprocess
  config: shellprocess_grubtheme.conf
- id:     snapper
  module: shellprocess
  config: shellprocess_snapper.conf
- id:     apps
  module: notesqml
  config: notesqml_apps.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - notesqml@apps
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - shellprocess@cleanlive
  - machineid
  - locale
  - keyboard
  - localecfg
  - fstab
  - luksbootkeyfile
  - luksopenswaphookcfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess@hardware
  - plymouthcfg
  - initcpiocfg
  - initcpio
  - grubcfg
  - shellprocess@grubtheme
  - bootloader
  - shellprocess@secureboot
  - shellprocess@snapper
  - quantumapps
  - umount
- show:
  - finished

branding: quantum
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
