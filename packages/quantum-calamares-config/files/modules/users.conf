---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: false
      system: true
    - lp
    - video
    - network
    - storage
    - audio
    - name: gamemode
      must_exist: false
      system: true
    - name: autologin
      must_exist: false
      system: true

sudoersGroup: wheel
sudoersConfigureWithGroup: true
autologinGroup: autologin
doAutologin: false
setRootPassword: false
doReusePassword: true

passwordRequirements:
    minLength: 4
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true

user:
  shell: /bin/bash
  forbidden_names: [ root, liveuser ]
  home_permissions: "o700"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${first}-quantum"
  forbidden_names: [ localhost ]
