---
efi:
    mountPoint:      "/boot/efi"
    recommendedSize: 512MiB
    minimumSize:     300MiB
    label:           "EFI"

# Quantum usa zram, así que normalmente no hace falta swap en disco.
userSwapChoices:
    - none
    - small
    - suspend
    - file
initialSwapChoice: none

luksGeneration: luks1
enableLuksAutomatedPartitioning: true

drawNestedPartitions:      false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none

# btrfs permite los puntos de restauración automáticos.
defaultFileSystemType:    "btrfs"
availableFileSystemTypes: ["btrfs", "ext4", "xfs"]

# /boot va en su propia partición ext4: GRUB 2.16 lee mal los archivos de un
# btrfs recién creado (el kernel queda corrupto al cargarlo). ext4 lo lee bien en
# BIOS y UEFI, y además queda sin cifrar aunque se cifre el sistema.
partitionLayout:
    - name: "boot"
      filesystem: "ext4"
      noEncrypt: true
      mountPoint: "/boot"
      size: 1G
    - name: "quantum"
      filesystem: "unknown"
      mountPoint: "/"
      size: 100%

essentialMounts: [ "live-*", "control", "ventoy" ]
lvm:
    enable: true
