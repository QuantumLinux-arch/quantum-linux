---
units:
  - name: NetworkManager
    action: enable
  - name: bluetooth
    action: enable
    mandatory: false
  - name: sddm
    action: enable
  - name: fstrim.timer
    action: enable
  - name: power-profiles-daemon
    action: enable
    mandatory: false
  - name: cups
    action: enable
    mandatory: false
  - name: avahi-daemon
    action: enable
    mandatory: false
  - name: systemd-timesyncd
    action: enable
    mandatory: false
  - name: paccache.timer
    action: enable
    mandatory: false
  # Un escritorio no necesita esperar la red para arrancar (ahorra hasta 2 minutos)
  - name: systemd-networkd-wait-online
    action: mask
    mandatory: false
  - name: NetworkManager-wait-online
    action: disable
    mandatory: false
