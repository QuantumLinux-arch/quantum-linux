---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "quiet", "loglevel=3", "nowatchdog" ]
defaults:
    GRUB_TIMEOUT: 3
    # "saved" no sirve en btrfs: GRUB no puede escribir grubenv ahí.
    GRUB_DEFAULT: 0
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    GRUB_DISABLE_RECOVERY: true
    GRUB_DISABLE_OS_PROBER: false
always_use_defaults: true
