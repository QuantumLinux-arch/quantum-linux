# Arranque seguro (Secure Boot) del sistema instalado: shim + GRUB y kernel firmados con
# una llave propia de este PC; si Secure Boot está activo, deja pedido registrar la llave.
---
dontChroot: false
timeout: 120
script:
    - "-/usr/lib/quantum/secureboot/setup"
i18n:
    name: "Preparando el arranque seguro"
